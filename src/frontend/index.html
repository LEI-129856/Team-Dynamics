<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Processador de Mensagens</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <h1>Processador de Mensagens</h1>
      <p>Copie a sua mensagem e carregue para extrair os dados.</p>

      <textarea id="messageInput" placeholder="Coloque aqui a sua  mensagem..."></textarea>
      <button id="processButton">Processar mensagem</button>
      <select id="messageTypeDropdown">
        <option value="" disabled selected>Selecione o user</option>
        <option value="type1">Bruno Frasco</option>
        <option value="type2">Marta Ribeiro</option>
      </select>
      <button id="NewFile"> Novo Excel</button>
      <button id="CleanMessage"> Apagar Mensagem</button>
      <div id="resultBox" class="result">Aguardando mensagem...</div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
